name: Build

on:
  push:
    branches: [ master, features/** ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # WPF (net8.0-windows) solo compila en un runner Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar PostgreSQL local (para los tests de GameRepository/MainViewModel)
        # windows-latest ya trae PostgreSQL preinstalado y en marcha (ver actions/runner-images) —
        # si ya hay un servicio postgresql-x64-*, "winget install" lo detecta y en vez de instalar
        # intenta un "upgrade" en el sitio; cuando no hay versión más nueva sale con código de error
        # y rompe el job entero aunque no haga falta instalar nada. Por eso solo se instala si de
        # verdad no hay ningún PostgreSQL ya arrancado en el runner.
        run: |
          $existing = Get-Service -Name 'postgresql-x64-*' -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "PostgreSQL ya viene preinstalado en el runner ($($existing.Name)) — se omite winget install."
          } else {
            winget install --id PostgreSQL.PostgreSQL.17 --silent --accept-package-agreements --accept-source-agreements --custom "--unattendedmodeui minimal --superpassword Admin123!"
          }
        shell: pwsh

      - name: Forzar contraseña de PostgreSQL a Admin123!
        # windows-latest ya trae PostgreSQL preinstalado y en marcha (ver actions/runner-images).
        # El paso anterior hace un "upgrade" sobre esa instalación en vez de una instalación limpia,
        # así que --superpassword no se aplica y la contraseña real sigue siendo la de fábrica de la imagen.
        # Aquí se fuerza a Admin123! sea cual sea esa contraseña de partida: se pone pg_hba.conf en modo
        # trust temporalmente, se cambia la contraseña sin necesitar la antigua, y se revierte.
        run: |
          $svc = Get-Service -Name 'postgresql-x64-*' -ErrorAction Stop | Select-Object -First 1
          Write-Host "Servicio PostgreSQL detectado: $($svc.Name) (estado: $($svc.Status))"

          # No asumir la ruta del directorio de datos (en windows-latest vive fuera de
          # "Program Files", p. ej. C:\PostgreSQL\14\data, y tras el "upgrade" de winget no se
          # puede dar por hecho a qué ruta acaba apuntando) — se lee del ImagePath real del
          # servicio de Windows, que siempre trae el ejecutable y el "-D <datadir>" reales.
          $imagePath = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$($svc.Name)" -ErrorAction Stop).ImagePath
          Write-Host "ImagePath: $imagePath"

          if ($imagePath -notmatch '^"([^"]+)"') { throw "No se pudo determinar el ejecutable de PostgreSQL desde ImagePath: $imagePath" }
          $binDir = Split-Path $Matches[1] -Parent
          $psql = Join-Path $binDir 'psql.exe'
          $pgctl = Join-Path $binDir 'pg_ctl.exe'

          if ($imagePath -notmatch '-D\s+"([^"]+)"') { throw "No se pudo determinar el directorio de datos de PostgreSQL desde ImagePath: $imagePath" }
          $dataDir = $Matches[1]
          $hba = Join-Path $dataDir 'pg_hba.conf'
          Write-Host "Directorio de datos: $dataDir"

          # El servicio de Windows no arranca en este runner: tanto Start-Service como
          # Restart-Service fallan con el mismo error genérico del SCM ("Cannot start service
          # ... on computer '.'"), incluso partiendo de un estado limpio (servicio recién
          # detectado, sin haber tocado nada todavía) — no es un problema de pg_hba.conf ni de
          # timing, el propio Service Control Manager no consigue arrancarlo (sospecha: cuenta
          # de servicio con credenciales rotas al clonar la imagen del runner, típico de
          # servicios "Log on as" un usuario local tras generalizar/desplegar una imagen).
          # Se arranca Postgres directamente con pg_ctl, sin pasar por el SCM en absoluto —
          # evita ese punto de fallo por completo en vez de seguir intentando arrancar el
          # servicio de Windows.
          if ($svc.Status -ne 'Running') {
            Write-Host "El servicio de Windows no está en marcha; arrancando PostgreSQL directamente con pg_ctl..."
            $startupLog = Join-Path $dataDir 'ci_startup.log'
            & $pgctl start -D "$dataDir" -l "$startupLog" -w -t 30
            if ($LASTEXITCODE -ne 0) { throw "pg_ctl no pudo arrancar PostgreSQL" }
          }

          Copy-Item $hba "$hba.bak" -Force
          (Get-Content $hba) -replace 'scram-sha-256', 'trust' -replace '\bmd5\b', 'trust' | Set-Content $hba

          # pg_ctl reload en vez de Restart-Service: releer pg_hba.conf no necesita parar y
          # volver a arrancar el servicio de Windows entero, solo que el postmaster ya en marcha
          # reciba la señal de recarga — Restart-Service empezó a fallar de forma intermitente en
          # el runner con "Cannot start service ... on computer '.'" (sin más detalle del SCM),
          # y reload evita ese punto de fallo por completo al no tocar el estado del servicio.
          & $pgctl reload -D "$dataDir"
          Start-Sleep -Seconds 3

          & $psql -U postgres -h localhost -c "ALTER USER postgres WITH PASSWORD 'Admin123!';"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo cambiar la contraseña de postgres" }

          Copy-Item "$hba.bak" $hba -Force
          & $pgctl reload -D "$dataDir"
          Start-Sleep -Seconds 3
        shell: pwsh

      - name: Restaurar dependencias
        run: dotnet restore VideoGameLibrary.sln

      - name: Verificar formato (.editorconfig)
        run: dotnet format VideoGameLibrary.sln --verify-no-changes

      - name: Compilar (Release)
        run: dotnet build VideoGameLibrary.sln -c Release --no-restore

      - name: Ejecutar tests
        run: dotnet test VideoGameLibrary.Tests\VideoGameLibrary.Tests.csproj -c Release --no-build
