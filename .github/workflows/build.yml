name: Build

on:
  push:
    branches: [ master, features/** ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # WPF (net8.0-windows) solo compila en un runner Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar PostgreSQL local (para los tests de GameRepository/MainViewModel)
        run: |
          winget install --id PostgreSQL.PostgreSQL.17 --silent --accept-package-agreements --accept-source-agreements --custom "--unattendedmodeui minimal --superpassword Admin123!"
        shell: pwsh

      - name: Forzar contraseña de PostgreSQL a Admin123!
        # windows-latest ya trae PostgreSQL preinstalado y en marcha (ver actions/runner-images).
        # El paso anterior hace un "upgrade" sobre esa instalación en vez de una instalación limpia,
        # así que --superpassword no se aplica y la contraseña real sigue siendo la de fábrica de la imagen.
        # Aquí se fuerza a Admin123! sea cual sea esa contraseña de partida: se pone pg_hba.conf en modo
        # trust temporalmente, se cambia la contraseña sin necesitar la antigua, y se revierte.
        run: |
          $svc = Get-Service -Name 'postgresql-x64-*' -ErrorAction Stop | Select-Object -First 1
          Write-Host "Servicio PostgreSQL detectado: $($svc.Name)"

          # No asumir la ruta del directorio de datos (en windows-latest vive fuera de
          # "Program Files", p. ej. C:\PostgreSQL\14\data, y tras el "upgrade" de winget no se
          # puede dar por hecho a qué ruta acaba apuntando) — se lee del ImagePath real del
          # servicio de Windows, que siempre trae el ejecutable y el "-D <datadir>" reales.
          $imagePath = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$($svc.Name)" -ErrorAction Stop).ImagePath
          Write-Host "ImagePath: $imagePath"

          if ($imagePath -notmatch '^"([^"]+)"') { throw "No se pudo determinar el ejecutable de PostgreSQL desde ImagePath: $imagePath" }
          $psql = Join-Path (Split-Path $Matches[1] -Parent) 'psql.exe'

          if ($imagePath -notmatch '-D\s+"([^"]+)"') { throw "No se pudo determinar el directorio de datos de PostgreSQL desde ImagePath: $imagePath" }
          $dataDir = $Matches[1]
          $hba = Join-Path $dataDir 'pg_hba.conf'
          Write-Host "Directorio de datos: $dataDir"

          Copy-Item $hba "$hba.bak" -Force
          (Get-Content $hba) -replace 'scram-sha-256', 'trust' -replace '\bmd5\b', 'trust' | Set-Content $hba

          Restart-Service $svc.Name
          Start-Sleep -Seconds 5

          & $psql -U postgres -h localhost -c "ALTER USER postgres WITH PASSWORD 'Admin123!';"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo cambiar la contraseña de postgres" }

          Copy-Item "$hba.bak" $hba -Force
          Restart-Service $svc.Name
          Start-Sleep -Seconds 5
        shell: pwsh

      - name: Restaurar dependencias
        run: dotnet restore VideoGameLibrary.sln

      - name: Verificar formato (.editorconfig)
        run: dotnet format VideoGameLibrary.sln --verify-no-changes

      - name: Compilar (Release)
        run: dotnet build VideoGameLibrary.sln -c Release --no-restore

      - name: Ejecutar tests
        run: dotnet test VideoGameLibrary.Tests\VideoGameLibrary.Tests.csproj -c Release --no-build
